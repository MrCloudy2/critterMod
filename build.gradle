plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version '2.8.7'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/crittermod.accesswidener")
}

repositories {
	maven { name = 'NotEnoughUpdates'; url = 'https://maven.notenoughupdates.org/releases' }
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MoulConfig is nested in the output jar, so the mod needs nothing installed
	// alongside it. Fabric Loader deduplicates nested jars across mods.
	def moulconfig = "org.notenoughupdates.moulconfig:${project.moulconfig_target}:${project.moulconfig_version}"
	implementation(moulconfig)
	include(moulconfig)

	// MoulConfig is written in Kotlin; the stdlib comes from fabric-language-kotlin
	// at runtime, so it is only needed on the compile classpath here.
	compileOnly("org.jetbrains.kotlin:kotlin-stdlib:2.1.0")

	implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

processResources {
	def expandProps = [version: project.version, minecraft_depends: project.minecraft_depends]
	inputs.properties expandProps

	filesMatching("fabric.mod.json") {
		expand expandProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// --- Parser test harness ----------------------------------------------------
// ChatParser and the data registry are plain Java with no Minecraft imports, so
// they can be exercised against the real Hypixel logs without launching the
// game. `./gradlew replayLogs -Plogs=<dir>` prints a session-by-session report.
tasks.register('replayLogs', JavaExec) {
	description = 'Replay Hypixel chat logs through ChatParser and print session stats.'
	group = 'verification'
	classpath = sourceSets.main.output + configurations.runtimeClasspath
	mainClass = 'dev.rok.crittermod.importer.LogReplayMain'
	if (project.hasProperty('logs')) args project.property('logs')
}

// --- Auto-deploy to the AtLauncher test instance ----------------------------
def deployDir = file(project.findProperty('deployDir')
		?: '/home/rok/.local/share/atlauncher/instances/SkyBlockEnhancedModernEdition/mods')

tasks.register('deployToInstance', Copy) {
	description = 'Copy the built mod jar into the AtLauncher SkyBlock instance.'
	group = 'fabric'
	dependsOn tasks.named('jar')
	onlyIf { deployDir.isDirectory() }
	doFirst { delete fileTree(deployDir) { include 'crittermod-*.jar' } }
	from tasks.named('jar')
	into deployDir
	doLast { logger.lifecycle("deployToInstance -> ${deployDir}") }
}

tasks.named('jar') { finalizedBy 'deployToInstance' }


// --- Modrinth publishing -----------------------------------------------------
// Run with:  MODRINTH_TOKEN=<your token> ./gradlew modrinth
// The token is read from the environment and never stored in the repo. Create one
// at https://modrinth.com/settings/pats with the "Create versions" scope.
modrinth {
	token = providers.environmentVariable('MODRINTH_TOKEN')
	projectId = 'critter-mod'
	versionNumber = project.mod_version
	versionName = "v${project.mod_version}"
	versionType = 'release'
	uploadFile = tasks.named('jar')
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']
	// MoulConfig is nested in the jar, so it is deliberately not listed here.
	dependencies {
		required.project 'fabric-api'
		required.project 'fabric-language-kotlin'
	}
	syncBodyFrom = rootProject.file('README.md').text
	changelog = providers.provider {
		def notes = rootProject.file('CHANGELOG.md')
		notes.exists() ? notes.text : "See https://github.com/MrCloudy2/critterMod/releases/tag/v${project.mod_version}"
	}
}
