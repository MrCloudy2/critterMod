org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Gradle 9.4 needs Java <= 25. The shell default JDK here is Java 17, so pin the
# build JDK explicitly.
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk

# Fabric — target Minecraft 26.1.2, matching the SkyBlockEnhancedModernEdition
# AtLauncher instance this mod is tested in. 26.x ships DEOBFUSCATED, so there is
# no `mappings` dependency: code uses real Mojang names directly.
minecraft_version=26.1.2
minecraft_depends=~26.1
loader_version=0.19.3
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=0.1.0+mc26.1.2
maven_group=dev.rok
archives_base_name=crittermod

# Dependencies
fabric_api_version=0.155.2+26.1.2

# MoulConfig is the config GUI SkyHanni uses (by Moulberry and nea89). Its artifact
# ships a fabric.mod.json and its own bundled deps, so it is nested with `include`
# rather than shaded and relocated the way SkyHanni does it.
moulconfig_version=4.7.2
moulconfig_target=modern-26.1
modmenu_version=18.0.0
