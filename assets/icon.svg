<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Biome colours are the same four the HUD uses. -->
    <clipPath id="topHalf">
      <path d="M 86 262 A 170 170 0 0 1 426 262 Z"/>
    </clipPath>
    <clipPath id="bottomHalf">
      <path d="M 86 262 A 170 170 0 0 0 426 262 Z"/>
    </clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#232833"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4150"/>
      <stop offset="100%" stop-color="#20242c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>

  <!-- Capsule: the top shell is quartered, one wedge per Safari biome. -->
  <g clip-path="url(#topHalf)">
    <rect x="86"  y="92" width="85" height="170" fill="#55FF55"/>
    <rect x="171" y="92" width="85" height="170" fill="#FFAA00"/>
    <rect x="256" y="92" width="85" height="170" fill="#55FFFF"/>
    <rect x="341" y="92" width="85" height="170" fill="#AA00AA"/>
  </g>
  <g clip-path="url(#bottomHalf)">
    <rect x="86" y="262" width="340" height="170" fill="url(#shell)"/>
  </g>

  <!-- Gloss over the coloured shell only, so it reads as one rounded object. -->
  <g clip-path="url(#topHalf)">
    <ellipse cx="256" cy="150" rx="150" ry="86" fill="url(#gloss)"/>
  </g>

  <circle cx="256" cy="262" r="170" fill="none" stroke="#0b0d10" stroke-width="12"/>
  <rect x="86" y="243" width="340" height="38" fill="#0b0d10"/>

  <circle cx="256" cy="262" r="62" fill="#0b0d10"/>
  <circle cx="256" cy="262" r="46" fill="#eef2f7"/>
  <circle cx="256" cy="262" r="30" fill="#cbd3de"/>
  <circle cx="244" cy="250" r="12" fill="#ffffff" fill-opacity="0.85"/>
</svg>
